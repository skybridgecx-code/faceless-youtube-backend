name: YouMo CLI I11 Failure Recovery

on:
  push:
    branches:
      - tooling/youmo-cli-i11-focused-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile recovery test and runtime
        run: python -m py_compile tools/project_agent_runtime/*.py tests/test_project_agent_failure_recovery.py
      - name: Run failure recovery matrix
        run: python -m pytest -q tests/test_project_agent_failure_recovery.py
