name: YouMo CLI I14 Focused Validation

on:
  push:
    branches:
      - tooling/youmo-cli-i14-focused-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test runner
        run: python -m pip install pytest
      - name: Compile I14 tooling
        run: python -m py_compile tools/project_agent_runtime/promotion.py tools/project_agent_runtime/promotion_cli.py tools/project_agent_runtime/controller_release.py tools/project_agent_runtime/controller_release_cli.py scripts/youmo-promote-check
      - name: Run promotion and release tests
        run: python -m pytest -q tests/test_project_agent_promotion.py tests/test_project_agent_controller_release.py
