name: YouMo CLI I6 Diagnostic

on:
  push:
    branches:
      - tooling/youmo-cli-i6-diag-ci

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_project_agent_safety_cleanup.py
