name: YouMo CLI I8 Focused Validation

on:
  push:
    branches:
      - tooling/youmo-cli-i8-focused-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile I8 tooling
        run: python -m py_compile tools/project_agent_runtime/run_manifest.py tools/project_agent_runtime/doctor.py tools/project_agent_runtime/doctor_cli.py tools/project_agent_runtime/resume_cli.py tools/project_agent_runtime/build_cli.py tools/project_agent_runtime/audit_cli.py tools/project_agent_runtime/checkpoint_cli.py tools/project_agent_runtime/operation_lease.py scripts/youmo-doctor scripts/youmo-resume
      - name: Run I8 state tests
        run: python -m pytest -q tests/test_project_agent_runs.py
