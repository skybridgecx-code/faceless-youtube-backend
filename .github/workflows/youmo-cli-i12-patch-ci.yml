name: YouMo CLI I12 Candidate Builder

on:
  push:
    branches:
      - tooling/youmo-cli-i12-patch-ci
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update release compatibility expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          cli = Path('tools/project_agent_runtime/controller_release_cli.py')
          text = cli.read_text(encoding='utf-8')
          old = 'MANAGED_LAUNCHERS=youmo,youmo-build,youmo-audit,youmo-checkpoint,youmo-controller,youmo-doctor,youmo-resume'
          new = old + ',youmo-pilot'
          if old not in text:
              raise SystemExit('STOP: release CLI launcher inventory anchor not found')
          cli.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/test_project_agent_controller_release.py')
          text = test.read_text(encoding='utf-8')
          old_tail = '    "youmo-doctor",\n    "youmo-resume",\n)'
          new_tail = '    "youmo-doctor",\n    "youmo-resume",\n    "youmo-pilot",\n)'
          if old_tail not in text:
              raise SystemExit('STOP: ALL_LAUNCHERS anchor not found')
          text = text.replace(old_tail, new_tail, 1)
          old_assert = 'assert EXTRA_LAUNCHERS == ("youmo-doctor", "youmo-resume")'
          new_assert = 'assert EXTRA_LAUNCHERS == ("youmo-doctor", "youmo-resume", "youmo-pilot")'
          if old_assert not in text:
              raise SystemExit('STOP: EXTRA_LAUNCHERS assertion anchor not found')
          text = text.replace(old_assert, new_assert)
          if old not in text:
              raise SystemExit('STOP: bootstrap launcher inventory anchor not found')
          text = text.replace(old, new)
          test.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow from candidate tree
        run: git rm .github/workflows/youmo-cli-i12-patch-ci.yml
      - name: Install focused test runner
        run: python -m pip install pytest
      - name: Compile I12 tooling
        run: python -m py_compile tools/project_agent_runtime/*.py scripts/youmo-pilot
      - name: Run I12 focused compatibility and pilot tests
        run: python -m pytest -q tests/test_project_agent_controller_release.py tests/test_project_agent_pilot.py
      - name: Build one-commit candidate from canonical I11
        env:
          BASE_SHA: b5631b8d74a9b05d53b1c7cc54a3d3cbdc42b45f
        run: |
          set -euo pipefail
          git diff --check
          git add -A
          git diff --cached --name-only | sort
          TREE="$(git write-tree)"
          COMMIT="$(printf '%s\n' 'I12 tooling: add fail-closed live pilot readiness' | git commit-tree "$TREE" -p "$BASE_SHA")"
          test "$(git rev-parse "$COMMIT^")" = "$BASE_SHA"
          git push origin "$COMMIT:refs/heads/tooling/youmo-cli-i12-candidate"
          echo "CANDIDATE_SHA=$COMMIT"
