name: YouMo CLI I5 Baseline Full Validation

on:
  push:
    branches:
      - tooling/youmo-cli-i5-baseline-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-full-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Provenance diagnostics
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "BRANCH=$(git branch --show-current)"
          echo "=== TTS TEST PATHS ==="
          find tests -maxdepth 1 -type f -iname '*tts*' -print | sort
          echo "=== TEST_TTS_OPENAI EXISTS ==="
          test -e tests/test_tts_openai.py && echo YES || echo NO
          echo "=== STATUS ==="
          git status --porcelain=v1
      - name: Install repository requirements
        run: python -m pip install -r requirements.txt
      - name: Run full pytest suite
        run: python -m pytest -q
      - name: Check JavaScript syntax
        if: always()
        run: node --check app/static/app.js
