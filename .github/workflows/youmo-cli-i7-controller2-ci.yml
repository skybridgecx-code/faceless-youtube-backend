name: YouMo CLI I7 Controller2 Validation

on:
  push:
    branches:
      - tooling/youmo-cli-i7-controller2-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile controller tooling
        run: python -m py_compile tools/project_agent_runtime/controller.py tools/project_agent_runtime/controller_cli.py scripts/youmo-controller scripts/youmo-bootstrap
      - name: Run controller tests
        run: python -m pytest -q tests/test_project_agent_controller.py
