name: YouMo CLI I10 Simulated Pilot

on:
  push:
    branches:
      - tooling/youmo-cli-i10-pilot-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulated-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile runtime and pilot test
        run: python -m py_compile tools/project_agent_runtime/*.py tests/test_project_agent_end_to_end.py
      - name: Run simulated pilot
        run: python -m pytest -q tests/test_project_agent_end_to_end.py
