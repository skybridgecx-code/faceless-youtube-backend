name: YouMo CLI I5 Validation

on:
  push:
    branches:
      - tooling/youmo-cli-i5-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tooling-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile tooling
        run: python -m py_compile tools/project_agent_runtime/*.py scripts/youmo scripts/youmo-build scripts/youmo-audit scripts/youmo-checkpoint
      - name: Run I0-I5 focused tests
        run: python -m pytest -q tests/test_project_agent_runtime.py tests/test_project_agent_workspace.py tests/test_project_agent_build.py tests/test_project_agent_audit.py tests/test_project_agent_checkpoint.py
