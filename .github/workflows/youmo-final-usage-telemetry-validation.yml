name: YouMo Final Usage Telemetry Validation

on:
  push:
    branches:
      - tooling/youmo-cli-usage-telemetry

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Provenance
        run: |
          test "$(git rev-parse HEAD^)" = "c7ed0a9c5d4b4500ce59eace527d4f71c1264889"
          test "$(git merge-base HEAD a8ebeeb2aa136b5a49a854f93971ee8b04e113dc)" = "a8ebeeb2aa136b5a49a854f93971ee8b04e113dc"
          echo "HEAD=$(git rev-parse HEAD)"
      - name: Apply bounded telemetry patch
        run: |
          python tools/_apply_usage_telemetry_patch.py
          python tools/_fix_usage_telemetry_test_expectations.py
          python tools/_fix_usage_telemetry_safe_build.py
          git status --short
          ACTUAL="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          EXPECTED="$(printf '%s\n' \
            tests/test_project_agent_usage.py \
            tools/project_agent_runtime/audit_cli.py \
            tools/project_agent_runtime/audit_engine.py \
            tools/project_agent_runtime/build_cli.py \
            tools/project_agent_runtime/build_engine.py \
            tools/project_agent_runtime/overview.py \
            tools/project_agent_runtime/overview_cli.py \
            tools/project_agent_runtime/safe_build.py \
            tools/project_agent_runtime/usage.py | sort)"
          test "$ACTUAL" = "$EXPECTED"
      - name: Create repository virtualenv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install repository requirements
        run: python -m pip --python .venv/bin/python install -r requirements.txt
      - name: Compile telemetry tooling
        run: |
          python -m py_compile \
            tools/project_agent_runtime/usage.py \
            tools/project_agent_runtime/build_engine.py \
            tools/project_agent_runtime/safe_build.py \
            tools/project_agent_runtime/audit_engine.py \
            tools/project_agent_runtime/build_cli.py \
            tools/project_agent_runtime/audit_cli.py \
            tools/project_agent_runtime/overview.py \
            tools/project_agent_runtime/overview_cli.py
      - name: Focused usage and integration tests
        run: |
          pytest -q \
            tests/test_project_agent_usage.py \
            tests/test_project_agent_overview.py \
            tests/test_project_agent_end_to_end.py::test_simulated_cli_pilot_build_audit_checkpoint_doctor \
            tests/test_project_agent_failure_recovery.py::test_build_transport_failure_is_terminal_and_diagnosable \
            tests/test_project_agent_failure_recovery.py::test_operational_audit_failure_rolls_back_to_ready_for_audit \
            tests/test_project_agent_failure_recovery.py::test_semantic_audit_fail_is_terminal_not_checkpointable \
            tests/test_project_agent_failure_recovery.py::test_checkpoint_failure_is_retryable_after_local_identity_fix
      - name: All YouMo tests
        run: pytest -q tests/test_project_agent_*.py
      - name: Install FFmpeg and ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Full repository suite
        run: pytest -q
      - name: JavaScript syntax
        run: node --check app/static/app.js
      - name: Diff and governance gates
        run: |
          git diff --check
          git diff --exit-code a8ebeeb2aa136b5a49a854f93971ee8b04e113dc -- \
            architecture.lock.json ARCHITECTURE.md COMMERCIAL_SUCCESS.md .agents/rules/youtube-automation-project.md
          test -z "$(git diff --name-only a8ebeeb2aa136b5a49a854f93971ee8b04e113dc -- app migrations scripts/migrate_db.py | cat)"
          test -z "$(git diff --name-only a8ebeeb2aa136b5a49a854f93971ee8b04e113dc | grep -E '(^|/)content_factory\.db$' || true)"
      - name: Commit validated semantic patch on validation branch
        run: |
          git config user.name "YouMo Validation"
          git config user.email "youmo-validation@example.invalid"
          git add \
            tools/project_agent_runtime/usage.py \
            tools/project_agent_runtime/build_engine.py \
            tools/project_agent_runtime/safe_build.py \
            tools/project_agent_runtime/audit_engine.py \
            tools/project_agent_runtime/build_cli.py \
            tools/project_agent_runtime/audit_cli.py \
            tools/project_agent_runtime/overview.py \
            tools/project_agent_runtime/overview_cli.py \
            tests/test_project_agent_usage.py
          git diff --cached --check
          git commit -m "YouMo: add usage telemetry governor"
          git push --force origin HEAD:tooling/youmo-cli-usage-telemetry-validated
