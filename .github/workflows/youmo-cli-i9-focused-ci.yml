name: YouMo CLI I9 Focused Validation

on:
  push:
    branches:
      - tooling/youmo-cli-i9-focused-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile I9 tooling
        run: python -m py_compile tools/project_agent_runtime/controller_release.py tools/project_agent_runtime/controller_release_cli.py tools/project_agent_runtime/doctor_cli.py scripts/youmo-controller scripts/youmo-bootstrap scripts/youmo-doctor scripts/youmo-resume
      - name: Run controller compatibility and release tests
        run: python -m pytest -q tests/test_project_agent_controller.py tests/test_project_agent_controller_release.py
